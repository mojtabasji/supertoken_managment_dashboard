services:
  # Admin Portal App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supertokens-admin-app
    ports:
      - "8956:3000"
    environment:
      # SuperTokens Core connection
      SUPERTOKENS_CONNECTION_URI: "${SUPERTOKENS_CONNECTION_URI}"
        
      SUPERTOKENS_API_KEY: "${SUPERTOKENS_API_KEY}"
      
      # Admin credentials - MUST change in production
      ADMIN_EMAILS: "${ADMIN_EMAILS}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      
      # Session secret - MUST be at least 32 chars
      SESSION_SECRET: "${SESSION_SECRET}"
      
      # App base URL
      APP_BASE_URL: "${APP_BASE_URL}"
      
      # Audit DB path (inside container)
      AUDIT_DB_PATH: "${AUDIT_DB_PATH}"
      
      NODE_ENV: production
    volumes:
      - audit_data:/app/data
    restart: unless-stopped

volumes:
  audit_data:
